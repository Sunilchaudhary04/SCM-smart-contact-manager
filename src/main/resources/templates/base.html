<!DOCTYPE html>
<html 
class="dark"
lang="en" th:fragment="parent(content, title, script)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:replace="${title}">SCM</title>

   
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
     <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="dark:bg-gray-900 dark:text-white">

    <!-- common Header -->
  <div th:replace="~{navbar :: navbar}"></div>

    <!-- main content -->
<div class="p-4">
    <section th:replace="${content}"></section>
</div>
    <!-- flowbite content -->

    <!-- common footer -->
     <footer class="p-4">
        Footer:Learn code with Sunil
     </footer>

     <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
     <th:block th:replace="${script}"></th:block>
</body>
</html>
